[platformio]
default_envs = waveshare_5b

[env:waveshare_5b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -I include
  -DFW_VERSION=\"0.5.7\"
lib_deps =
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.0.1
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
  bblanchon/ArduinoJson@^7.0.0
